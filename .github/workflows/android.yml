name: Parley Android
on:
  push:
    branches: ['parley/**']
  pull_request:
    paths: ['android/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Native sources at pinned commits
        shell: pwsh
        run: ./scripts/native-deps.ps1
      - name: Install native toolchain
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble APK, unit tests and lint
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parley-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
  native-integration:
    needs: debug-apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: parley-android-debug
          path: test-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install test-artifacts/outputs/apk/debug/app-debug.apk
            adb install test-artifacts/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class chat.parley.NativeIntegrationTest chat.parley.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (4 tests)' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parley-native-test-results
          path: instrumentation.txt
