name: Parley desktop
on:
  push:
    branches: [main, 'parley/**']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libsodium-dev pkg-config libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test GUI and profile creation
        run: |
          mkdir -p "$RUNNER_TEMP/hau-smoke"
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software XDG_DATA_HOME="$RUNNER_TEMP/hau-smoke" timeout 5s ./build/bin/Parley > "$RUNNER_TEMP/hau-smoke.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/hau-smoke.log"
          test "$status" -eq 124
          test "$(find "$RUNNER_TEMP/hau-smoke" -name profile.tox | wc -l)" -eq 1
      - name: Package
        run: |
          mkdir -p dist/Parley-linux-x86_64/licenses
          cp build/bin/Parley dist/Parley-linux-x86_64/
          cp README.md LICENSE android/COPYING dist/Parley-linux-x86_64/
          cp build/_deps/toxcore-src/LICENSE dist/Parley-linux-x86_64/licenses/toxcore-GPL.txt
          cp /usr/share/doc/libsodium23/copyright dist/Parley-linux-x86_64/licenses/libsodium-copyright.txt
          tar -czf Parley-linux-x86_64.tar.gz -C dist Parley-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Parley-linux-x86_64
          path: Parley-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtshadertools'
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Locate pkgconf
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "(vcpkg_installed|packages)" } | Select-Object -First 1
          if (-not $pkg) { throw 'vcpkg pkgconf.exe was not found' }
          "HAU_PKGCONF=$($pkg.FullName)" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DPKG_CONFIG_EXECUTABLE="$env:HAU_PKGCONF"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package runnable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Parley-windows-x64/licenses | Out-Null
          Copy-Item build/bin/Parley.exe dist/Parley-windows-x64/
          Copy-Item README.md,LICENSE,android/COPYING dist/Parley-windows-x64/
          Copy-Item build/_deps/toxcore-src/LICENSE dist/Parley-windows-x64/licenses/toxcore-GPL.txt
          $notices = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter copyright | Where-Object { $_.FullName -match '[\\/]x64-windows-static-md[\\/]share[\\/][^\\/]+[\\/]copyright$' }
          if (-not ($notices | Where-Object { $_.Directory.Name -eq 'libsodium' })) { throw 'libsodium copyright notice was not found' }
          foreach ($notice in $notices) { Copy-Item $notice.FullName "dist/Parley-windows-x64/licenses/$($notice.Directory.Name)-copyright.txt" }
          if (Test-Path "$env:QT_ROOT_DIR/LICENSES") { Copy-Item "$env:QT_ROOT_DIR/LICENSES" dist/Parley-windows-x64/licenses/Qt -Recurse }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --qmldir ui/qml dist/Parley-windows-x64/Parley.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/Parley-windows-x64 -DestinationPath Parley-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Parley-windows-x64
          path: Parley-windows-x64.zip
      - name: Package opt-in native interoperability test tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Parley-test-tools | Out-Null
          Copy-Item build/hau_tests.exe dist/Parley-test-tools/
          Copy-Item README.md,LICENSE,android/COPYING dist/Parley-test-tools/
          Copy-Item dist/Parley-windows-x64/licenses dist/Parley-test-tools/licenses -Recurse
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime dist/Parley-test-tools/hau_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/Parley-test-tools -DestinationPath Parley-test-tools.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Parley-test-tools
          path: Parley-test-tools.zip
